name: CI - Tests & Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    # Weekly advisory scan (Monday 06:17 UTC); only the security jobs run on schedule.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend-windows:
    name: Test Python Backend (Windows)
    if: github.event_name != 'schedule'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Constrain to the packaged pins so tests exercise the versions that ship.
        pip install -r requirements-windows.txt -r requirements-dev.txt -c requirements-windows-build.txt

    - name: Run Python unit tests
      run: python -m pytest tests/python

    - name: Validate Python syntax (recursive under backend/)
      run: python scripts/check_python_syntax.py

    - name: Smoke-check device manager
      shell: pwsh
      run: |
        python backend/device_manager.py > $null 2>&1
        if ($LASTEXITCODE -ne 0) { Write-Host "Device manager check complete (expected on CI without hardware)" }

    - name: Check code style
      run: |
        pip install flake8
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

  test-backend-macos:
    name: Test Python Backend (macOS)
    if: github.event_name != 'schedule'
    runs-on: macos-14  # Apple Silicon runner
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Constrain to the packaged pins so tests exercise the versions that ship.
        pip install -r requirements-macos.txt -r requirements-dev.txt -c requirements-macos-build.txt

    - name: Run Python unit tests
      run: python -m pytest tests/python

    - name: Validate Python syntax (recursive under backend/)
      run: python scripts/check_python_syntax.py

    - name: Test PyObjC imports
      run: |
        echo "Testing PyObjC framework imports..."
        python -c "
        import sys
        try:
            from ScreenCaptureKit import SCShareableContent, SCContentFilter, SCStreamConfiguration, SCStream
            print('✓ ScreenCaptureKit imports OK')
        except ImportError as e:
            print(f'⚠ ScreenCaptureKit import failed: {e}')
            # Don't fail - PyObjC may have issues on CI runners

        try:
            from AVFoundation import AVAudioFormat
            print('✓ AVFoundation imports OK')
        except ImportError as e:
            print(f'⚠ AVFoundation import failed: {e}')

        try:
            import sounddevice as sd
            print('✓ sounddevice imports OK')
        except ImportError as e:
            print(f'✗ sounddevice import failed: {e}')
            sys.exit(1)

        try:
            import numpy as np
            print('✓ numpy imports OK')
        except ImportError as e:
            print(f'✗ numpy import failed: {e}')
            sys.exit(1)
        "

    - name: Build Swift AudioCaptureHelper
      run: |
        echo "Building Swift AudioCaptureHelper..."
        cd swift/AudioCaptureHelper
        swift build -c release --arch arm64
        echo "✓ Swift helper built successfully"

        # Find and verify binary
        BINARY=""
        if [ -f .build/release/audiocapture-helper ]; then
          BINARY=".build/release/audiocapture-helper"
        elif [ -f .build/arm64-apple-macosx/release/audiocapture-helper ]; then
          BINARY=".build/arm64-apple-macosx/release/audiocapture-helper"
        fi

        if [ -n "$BINARY" ]; then
          echo "✓ Binary found at $BINARY"
          BEFORE=$(stat -f%z "$BINARY")
          strip "$BINARY"
          AFTER=$(stat -f%z "$BINARY")
          echo "✓ Stripped: ${BEFORE} → ${AFTER} bytes"
        else
          echo "✗ Binary not found at expected locations"
          ls -la .build/ || true
          exit 1
        fi

    - name: Check code style
      run: |
        pip install flake8
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

    - name: Install Rust toolchain
      # dtolnay/rust-toolchain master as of 2026-08-05 (PR #182)
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: '1.88.0'
        targets: aarch64-apple-darwin
        components: rustfmt, clippy

    - name: Cache cargo
      # Swatinem/rust-cache v2.9.2
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: native/speakrs-cli
        cache-on-failure: true

    - name: Test speakrs-cli
      working-directory: native/speakrs-cli
      run: cargo test --locked

    - name: Build speakrs-cli release
      working-directory: native/speakrs-cli
      run: cargo build --release --locked --target aarch64-apple-darwin

    - name: Cache Speakrs CPU smoke artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/speakrs-cpu-smoke
        key: speakrs-cpu-smoke-${{ runner.os }}-${{ hashFiles('native/speakrs-cli/ci-cpu-smoke-pins.json', 'src/ai-addon/speakrs-pack-spec.js', 'src/ai-addon/speakrs-model-files.json') }}

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Run frontend regression tests
      run: npm run test:js

    - name: Speakrs CPU-mode inference smoke
      run: node scripts/run-speakrs-cpu-smoke.js --cli native/speakrs-cli/target/aarch64-apple-darwin/release/speakrs-cli

    - name: Build packaged macOS app smoke test
      env:
        # electron-builder skips signing on pull_request unless this is set.
        # identity "-" is ad-hoc; there is no Developer ID secret to leak.
        CSC_FOR_PULL_REQUEST: true
      run: |
        echo "Open file limit before: $(ulimit -n)"
        ulimit -n 10240 || true
        echo "Open file limit after: $(ulimit -n)"
        npm run build:mac:dir

    - name: Verify packaged macOS app smoke checks
      run: bash scripts/verify-macos-packaged-app.sh

  test-frontend:
    name: Test Electron Frontend & Build Smoke
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Rust toolchain
      # dtolnay/rust-toolchain master as of 2026-08-05 (PR #182)
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: '1.88.0'
        targets: x86_64-pc-windows-msvc
        components: rustfmt, clippy

    - name: Cache cargo
      # Swatinem/rust-cache v2.9.2
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: native/speakrs-cli
        cache-on-failure: true

    - name: Test speakrs-cli
      working-directory: native/speakrs-cli
      run: cargo test --locked

    - name: Prove Windows cuda,load-dynamic compiles without a CUDA toolkit
      working-directory: native/speakrs-cli
      run: cargo build --release --locked --target x86_64-pc-windows-msvc

    - name: Cache Speakrs CPU smoke artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/speakrs-cpu-smoke
        key: speakrs-cpu-smoke-${{ runner.os }}-${{ hashFiles('native/speakrs-cli/ci-cpu-smoke-pins.json', 'src/ai-addon/speakrs-pack-spec.js', 'src/ai-addon/speakrs-model-files.json') }}

    - name: Install dependencies
      run: npm ci

    - name: Speakrs CPU-mode inference smoke
      run: node scripts/run-speakrs-cpu-smoke.js --cli native/speakrs-cli/target/x86_64-pc-windows-msvc/release/speakrs-cli.exe

    - name: Validate JavaScript syntax under src/
      run: npm run test:syntax

    - name: Run frontend regression tests
      run: npm run test:js

    - name: Build packaged app smoke test
      run: npm run build:dir

    - name: Verify packaged build output
      shell: pwsh
      run: |
        if (-not (Test-Path "dist/win-unpacked")) {
          throw "Missing dist/win-unpacked build output"
        }

        $exe = Get-ChildItem "dist/win-unpacked" -Filter *.exe | Select-Object -First 1
        if (-not $exe) {
          throw "Missing executable in dist/win-unpacked"
        }

        $helper = Get-ChildItem "dist/win-unpacked" -Recurse -Filter "audiocapture-helper" -ErrorAction SilentlyContinue
        if ($helper) {
          throw "Windows package contains stale macOS audiocapture-helper"
        }

        $cli = "dist/win-unpacked/resources/bin/speakrs-cli.exe"
        if (-not (Test-Path $cli)) {
          throw "Windows package is missing resources/bin/speakrs-cli.exe"
        }
        if ((Get-Item $cli).Length -le 0) {
          throw "Windows package speakrs-cli.exe is empty"
        }

        $wavBin = "dist/win-unpacked/resources/bin/speakrs-two-speaker-16k.wav"
        if (-not (Test-Path $wavBin) -or (Get-Item $wavBin).Length -le 0) {
          throw "Windows package is missing the canonical Speakrs validation fixture WAV"
        }

        $wavBackend = "dist/win-unpacked/resources/backend/diarization/fixtures/speakrs-two-speaker-16k.wav"
        if (Test-Path $wavBackend) {
          throw "Windows package must not ship a duplicate Speakrs fixture under backend/diarization/fixtures"
        }

        if (Test-Path "dist/win-unpacked/resources/tests/fixtures/speakrs-two-speaker-16k.wav") {
          throw "Windows package must not ship tests/fixtures as the Speakrs validation path"
        }

        node scripts/verify-speakrs-packaging.js --packaged

    - name: Check for npm security vulnerabilities
      run: npm audit --audit-level=high

  test-packaging-linux:
    name: Test Python Backend and Linux Packaging (Ubuntu)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements-linux.txt
          requirements-linux-build.txt
          requirements-dev.txt

    - name: Install package inspection tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends zstd libarchive-tools libpulse0 fakeroot dpkg xvfb

    - name: Install Rust toolchain
      # dtolnay/rust-toolchain master as of 2026-08-05 (PR #182)
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: '1.88.0'
        targets: x86_64-unknown-linux-gnu
        components: rustfmt, clippy

    - name: Cache cargo
      # Swatinem/rust-cache v2.9.2
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        workspaces: native/speakrs-cli
        cache-on-failure: true

    - name: Test speakrs-cli
      working-directory: native/speakrs-cli
      run: cargo test --locked

    - name: Build speakrs-cli Linux x86_64 release (non-GPU structural check)
      working-directory: native/speakrs-cli
      run: cargo build --release --locked --target x86_64-unknown-linux-gnu

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Constrain to the packaged pins so tests exercise the versions that ship.
        pip install -r requirements-linux.txt -r requirements-dev.txt -c requirements-linux-build.txt

    - name: Install Node dependencies
      run: npm ci

    - name: Cache Speakrs CPU smoke artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/speakrs-cpu-smoke
        key: speakrs-cpu-smoke-${{ runner.os }}-${{ hashFiles('native/speakrs-cli/ci-cpu-smoke-pins.json', 'src/ai-addon/speakrs-pack-spec.js', 'src/ai-addon/speakrs-model-files.json') }}

    - name: Speakrs CPU-mode inference smoke (non-GPU structural check)
      run: node scripts/run-speakrs-cpu-smoke.js --cli native/speakrs-cli/target/x86_64-unknown-linux-gnu/release/speakrs-cli

    - name: Run the full automated suite
      run: xvfb-run -a npm run test:all

    - name: Build Linux unpacked, AppImage, pacman, and deb packages
      run: |
        npm run prepare-build
        npx electron-builder build --linux dir AppImage pacman deb --x64 --publish never

    - name: Verify packaged Linux layout, AppImage runtime, pacman metadata, and deb control
      run: node scripts/verify-linux-packaging.js --unpacked --appimage --pacman --deb

  security-audit:
    name: Security audit (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: npm
            runner: ubuntu-latest
            kind: npm
          - label: windows-python
            runner: windows-latest
            kind: pip
            target: windows
          - label: macos-python
            runner: macos-14
            kind: pip
            target: macos
          - label: linux-python
            runner: ubuntu-latest
            kind: pip
            target: linux

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      if: matrix.kind == 'npm'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Node dependencies
      if: matrix.kind == 'npm'
      run: npm ci

    - name: Report all npm advisories (moderate and below do not fail)
      if: matrix.kind == 'npm'
      run: npm audit || true

    - name: Fail on high or critical npm advisories
      if: matrix.kind == 'npm'
      run: npm audit --audit-level=high

    - name: Set up Python 3.11
      if: matrix.kind == 'pip'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install pinned audit tooling
      if: matrix.kind == 'pip'
      run: python -m pip install pip-audit==2.10.1

    - name: Check the build pins are the complete resolved closure
      if: matrix.kind == 'pip'
      shell: bash
      run: python scripts/check-build-requirements-closure.py ${{ matrix.target }}

    - name: Audit pinned Python build dependencies
      if: matrix.kind == 'pip'
      shell: bash
      # macOS: torch==2.13.0 and setuptools==84.0.0 are installed only for
      # reproducible packaging resolution and removed before the app ships
      # (MACOS_RUNTIME_REMOVABLE_PACKAGES in prepare-resources.js).
      run: python -m pip_audit -r requirements-${{ matrix.target }}-build.txt

  optional-runtime-audit:
    name: Security audit (Parakeet locks, bootstrap pip, native catalog)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install pinned audit tooling
      run: python -m pip install pip-audit==2.10.1

    - name: Canary - an intentionally vulnerable lock must produce findings
      run: |
        node scripts/extract-dependency-inventory.js \
          --parakeet-lock tests/fixtures/dependency-inventory/vulnerable-parakeet.lock.json \
          --out "$RUNNER_TEMP/canary.txt"
        python scripts/pip_audit_inventory.py "$RUNNER_TEMP/canary.txt" --expect-findings

    - name: Audit Parakeet wheel locks and the bootstrap pip wheel
      run: |
        node scripts/extract-dependency-inventory.js --list
        status=0
        for id in parakeet-linux-cuda parakeet-macos-metal parakeet-windows-cuda bootstrap; do
          node scripts/extract-dependency-inventory.js --inventory "$id" --out "$RUNNER_TEMP/$id.txt"
          python scripts/pip_audit_inventory.py "$RUNNER_TEMP/$id.txt" || status=1
        done
        exit $status

    - name: Report native runtime versions for manual advisory review
      run: |
        node -e "
          const native = require('./scripts/extract-dependency-inventory').loadInventories().find((i) => i.id === 'native');
          console.log(native.note);
          for (const entry of native.entries) console.log('  ' + entry.source + ': ' + entry.name + ' ' + entry.version);
        "

  pyannote-closure-audit:
    name: Security audit (pyannote ${{ matrix.platform }} resolved closure)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
          - platform: darwin-arm64
            runner: macos-14

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - name: Set up Python 3.11
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Install pinned audit tooling
      run: python -m pip install pip-audit==2.10.1

    - name: Resolve and audit the in-app pyannote dependency closure
      shell: bash
      run: |
        python scripts/qualify-pyannote-runtime.py --resolve-only \
          --platform-key ${{ matrix.platform }} --work-dir "$RUNNER_TEMP/pyannote"

  cargo-audit:
    name: Security audit (speakrs-cli Cargo.lock)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install pinned cargo-audit
      run: cargo install cargo-audit --version 0.22.2 --locked

    - name: Audit speakrs-cli dependencies
      working-directory: native/speakrs-cli
      run: cargo audit --deny warnings

  validate-docs:
    name: Validate Documentation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check markdown files
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        globs: |
          README.md
          docs/**/*.md
      continue-on-error: true

    - name: Check for broken links
      uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # 1.0.17
      with:
        config-file: '.github/markdown-link-config.json'
      continue-on-error: true
