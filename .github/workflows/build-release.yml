name: Build & Release Installer

# Updated to re-register workflow triggers with GitHub
on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub UI
    inputs:
      require_signed_release:
        description: "Require signed Windows installer and signed/notarized macOS DMG (keep false for unsigned dry-runs)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-speakrs-release-artifacts:
    name: Verify Speakrs release artifact checksums
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Speakrs pack verification downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/speakrs-pack-verify
          key: speakrs-pack-verify-${{ hashFiles('src/ai-addon/speakrs-pack-spec.js', 'src/ai-addon/speakrs-model-files.json') }}

      - name: Download and verify pinned Speakrs native model files
        run: node scripts/verify-speakrs-packaging.js --verify-pack-checksums

  build-installer:
    name: Build ${{ matrix.os }} Installer
    runs-on: ${{ matrix.runner }}
    needs: verify-speakrs-release-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            build-script: npm run build
            artifact-path: "dist/AvaNevis-Setup-*.exe"
            artifact-name: avanevis-installer-windows
          - os: macOS
            runner: macos-15 # Apple Silicon
            rust-target: aarch64-apple-darwin
            build-script: npm run build:mac
            artifact-path: "dist/AvaNevis-Setup-*.dmg"
            artifact-name: avanevis-installer-macos
          - os: Linux
            runner: ubuntu-24.04 # AppImage 1.0.2 is incompatible with Ubuntu 26.04 host libraries
            rust-target: x86_64-unknown-linux-gnu
            build-script: npm run build:linux
            artifact-path: |
              dist/AvaNevis-Setup-*.AppImage
              dist/AvaNevis-Setup-*.pkg.tar.zst
              dist/AvaNevis-Setup-*.deb
            artifact-name: avanevis-installer-linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master as of 2026-11-03 (upstream revision update)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.89.0"
          targets: ${{ matrix.rust-target }}
          components: rustfmt, clippy

      - name: Confirm Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Cache cargo
        # Swatinem/rust-cache v2.9.3
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: native/speakrs-cli
          cache-on-failure: true

      - name: Verify Swift version (macOS)
        if: matrix.os == 'macOS'
        run: |
          swift --version
          echo "Swift toolchain ready for AudioCaptureHelper build"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Linux package inspection tools
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file zstd libarchive-tools libpulse0 fakeroot dpkg

      - name: Create placeholder icon (if missing - Windows only)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          # Ensure build directory exists
          if (-not (Test-Path "build")) {
            New-Item -ItemType Directory -Path "build" | Out-Null
          }

          if (-not (Test-Path "build/icon.ico")) {
            Write-Host "Creating placeholder icon..."
            # Download a placeholder microphone icon
            $url = "https://raw.githubusercontent.com/icons8/flat-color-icons/master/png/256/microphone.png"
            $png = "build/temp.png"

            try {
              Invoke-WebRequest -Uri $url -OutFile $png -ErrorAction Stop

              # Convert PNG to ICO using PowerShell
              Add-Type -AssemblyName System.Drawing
              $img = [System.Drawing.Image]::FromFile((Resolve-Path $png))
              $icon = [System.Drawing.Icon]::FromHandle($img.GetHicon())
              $stream = [System.IO.File]::Create("build/icon.ico")
              $icon.Save($stream)
              $stream.Close()
              $img.Dispose()

              Remove-Item $png
              Write-Host "Placeholder icon created!"
            } catch {
              Write-Host "Could not create icon, using fallback..."
              # Create a minimal 1x1 ICO as absolute fallback
              $bytes = @(0,0,1,0,1,0,16,16,0,0,1,0,32,0,104,4,0,0,22,0,0,0)
              [System.IO.File]::WriteAllBytes("build/icon.ico", $bytes)
            }
          }

      # Note: npm run build/build:mac includes prepare-build which:
      # 1. Cleans dist/ folder (prevents stale files from previous builds)
      # 2. Downloads Python runtime, ffmpeg, and prepares dependencies
      - name: Build installer (Windows)
        if: matrix.os == 'Windows'
        env:
          AVANEVIS_REQUIRE_SIGNED_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.require_signed_release == true) && '1' || '0' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WINDOWS_AZURE_ENDPOINT: ${{ secrets.WINDOWS_AZURE_ENDPOINT }}
          WINDOWS_AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.WINDOWS_AZURE_CODE_SIGNING_ACCOUNT }}
          WINDOWS_AZURE_CERT_PROFILE: ${{ secrets.WINDOWS_AZURE_CERT_PROFILE }}
          WINDOWS_AZURE_PUBLISHER_NAME: ${{ secrets.WINDOWS_AZURE_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: ${{ matrix.build-script }}
        timeout-minutes: 75

      - name: Build installer (macOS)
        if: matrix.os == 'macOS'
        env:
          AVANEVIS_REQUIRE_SIGNED_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.require_signed_release == true) && '1' || '0' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "Open file limit before: $(ulimit -n)"
          ulimit -n 10240 || true
          echo "Open file limit after: $(ulimit -n)"
          ${{ matrix.build-script }}
        timeout-minutes: 75

      - name: Notarize and staple macOS DMG
        if: matrix.os == 'macOS'
        env:
          AVANEVIS_REQUIRE_SIGNED_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.require_signed_release == true) && '1' || '0' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/notarize-macos-dmg.sh
        timeout-minutes: 30

      - name: Build installers (Linux)
        if: matrix.os == 'Linux'
        run: ${{ matrix.build-script }}
        timeout-minutes: 75

      - name: Verify packaged Speakrs CLI and fixture
        if: matrix.os != 'Linux'
        run: node scripts/verify-speakrs-packaging.js --packaged

      - name: Verify Windows Authenticode signatures
        if: matrix.os == 'Windows'
        shell: pwsh
        env:
          AVANEVIS_REQUIRE_SIGNED_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.require_signed_release == true) && '1' || '0' }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WINDOWS_AZURE_ENDPOINT: ${{ secrets.WINDOWS_AZURE_ENDPOINT }}
        run: |
          if ($env:AVANEVIS_REQUIRE_SIGNED_RELEASE -eq '1' -or -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or -not [string]::IsNullOrWhiteSpace($env:WINDOWS_AZURE_ENDPOINT)) {
            & ./scripts/verify-windows-installer.ps1 -SignaturesOnly
          } else {
            Write-Host "Skipping Windows Authenticode verification (no signing credentials configured)"
          }

      - name: Verify packaged macOS app smoke checks
        if: matrix.os == 'macOS'
        env:
          AVANEVIS_REQUIRE_SIGNED_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.require_signed_release == true) && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bash scripts/verify-macos-packaged-app.sh

      - name: Verify packaged macOS installer
        if: matrix.os == 'macOS'
        env:
          AVANEVIS_REQUIRE_SIGNED_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.require_signed_release == true) && '1' || '0' }}
        run: bash scripts/verify-macos-installer.sh

      - name: Verify packaged Linux artifacts
        if: matrix.os == 'Linux'
        run: node scripts/verify-linux-packaging.js --unpacked --appimage --pacman --deb

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF#refs/tags/v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version ($package_version) does not match tag ($tag_version)"
            exit 1
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 30
          if-no-files-found: error

  stage-release-legal:
    name: Stage and verify release legal assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Stage release legal assets
        env:
          RELEASE_LEGAL_DIR: ${{ github.workspace }}/release-legal
        run: node scripts/stage-release-legal-assets.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-legal
          path: release-legal/
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-installer
      - verify-speakrs-release-artifacts
      - stage-release-legal
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases

    steps:
      # Checkout must run before download-artifact: checkout clears the workspace and
      # would delete release-artifacts/ if download ran first (see f411436 regression).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified legal assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-legal
          path: release-legal

      - name: Download installer artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: avanevis-installer-*
          path: release-artifacts

      - name: Collect release assets
        id: collect_assets
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF#refs/tags/v}"
          installer="AvaNevis-Setup-${version}"
          windows_asset="release-artifacts/avanevis-installer-windows/${installer}.exe"
          macos_asset="release-artifacts/avanevis-installer-macos/${installer}.dmg"
          linux_appimage="release-artifacts/avanevis-installer-linux/${installer}.AppImage"
          linux_pacman="release-artifacts/avanevis-installer-linux/${installer}.pkg.tar.zst"
          linux_deb="release-artifacts/avanevis-installer-linux/${installer}.deb"
          for asset in "$windows_asset" "$macos_asset" "$linux_appimage" "$linux_pacman" "$linux_deb"; do
            if [ ! -s "$asset" ]; then
              echo "Missing or empty release asset: $asset"
              exit 1
            fi
          done

          mkdir -p release-upload
          cp "$windows_asset" release-upload/
          cp "$macos_asset" release-upload/
          cp "$linux_appimage" release-upload/
          cp "$linux_pacman" release-upload/
          cp "$linux_deb" release-upload/

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "windows_name=$(basename "$windows_asset")" >> $GITHUB_OUTPUT
          echo "windows_size=$(du -h "$windows_asset" | cut -f1)" >> $GITHUB_OUTPUT
          echo "macos_name=$(basename "$macos_asset")" >> $GITHUB_OUTPUT
          echo "macos_size=$(du -h "$macos_asset" | cut -f1)" >> $GITHUB_OUTPUT
          echo "linux_appimage_name=$(basename "$linux_appimage")" >> $GITHUB_OUTPUT
          echo "linux_appimage_size=$(du -h "$linux_appimage" | cut -f1)" >> $GITHUB_OUTPUT
          echo "linux_pacman_name=$(basename "$linux_pacman")" >> $GITHUB_OUTPUT
          echo "linux_pacman_size=$(du -h "$linux_pacman" | cut -f1)" >> $GITHUB_OUTPUT
          echo "linux_deb_name=$(basename "$linux_deb")" >> $GITHUB_OUTPUT
          echo "linux_deb_size=$(du -h "$linux_deb" | cut -f1)" >> $GITHUB_OUTPUT

      - name: Build release notes
        shell: bash
        run: |
          VERSION="${{ steps.collect_assets.outputs.version }}"
          NOTES_FILE="docs/releases/v${VERSION}.md"
          WINDOWS_NAME="${{ steps.collect_assets.outputs.windows_name }}"
          WINDOWS_SIZE="${{ steps.collect_assets.outputs.windows_size }}"
          MACOS_NAME="${{ steps.collect_assets.outputs.macos_name }}"
          MACOS_SIZE="${{ steps.collect_assets.outputs.macos_size }}"
          LINUX_APPIMAGE_NAME="${{ steps.collect_assets.outputs.linux_appimage_name }}"
          LINUX_APPIMAGE_SIZE="${{ steps.collect_assets.outputs.linux_appimage_size }}"
          LINUX_PACMAN_NAME="${{ steps.collect_assets.outputs.linux_pacman_name }}"
          LINUX_PACMAN_SIZE="${{ steps.collect_assets.outputs.linux_pacman_size }}"
          LINUX_DEB_NAME="${{ steps.collect_assets.outputs.linux_deb_name }}"
          LINUX_DEB_SIZE="${{ steps.collect_assets.outputs.linux_deb_size }}"
          REPO="${{ github.repository }}"

          # Escaped backticks so installer filenames are not executed by the shell.
          cat <<EOF > release-notes.md
          ## AvaNevis v${VERSION}

          ### Downloads

          - Windows installer: \`${WINDOWS_NAME}\` (${WINDOWS_SIZE})
          - macOS installer: \`${MACOS_NAME}\` (${MACOS_SIZE})
          - Linux AppImage: \`${LINUX_APPIMAGE_NAME}\` (${LINUX_APPIMAGE_SIZE})
          - Linux pacman package: \`${LINUX_PACMAN_NAME}\` (${LINUX_PACMAN_SIZE})
          - Linux deb package (experimental): \`${LINUX_DEB_NAME}\` (${LINUX_DEB_SIZE})

          EOF

          if [ -f "$NOTES_FILE" ]; then
            # Prefer the curated release doc (skip its H1); keep Downloads above.
            tail -n +2 "$NOTES_FILE" >> release-notes.md
            printf '\n' >> release-notes.md
          else
            cat <<EOF >> release-notes.md
          ### What's New

          - See \`docs/releases/v${VERSION}.md\` (add this file before tagging) or the [README](https://github.com/${REPO}/blob/master/README.md) Highlights for this release.

          ### Platform Support

          - Windows 10/11 x64
          - macOS 15+ on Apple Silicon
          - Linux x86_64 Core Beta (Omarchy first; other distros are experimental betas)

          ### Installation

          **Windows**
          1. Download the \`.exe\` installer.
          2. Run it. If SmartScreen appears, choose "More info" then "Run anyway".
          3. Launch AvaNevis from the Start Menu.

          **macOS**
          1. Download the \`.dmg\` file.
          2. Drag AvaNevis into Applications.
          3. The app is ad-hoc signed and not notarized. If macOS blocks it, use System Settings → Privacy & Security → Open Anyway after attempting to open it. See https://support.apple.com/en-us/102445.
          4. Grant microphone and screen recording permissions when prompted.

          **Linux Core Beta**
          1. On Omarchy/Arch install the pacman package, or run the AppImage. Debian-family friends can try the experimental \`.deb\`. See \`docs/guides/LINUX_EXPERIMENTAL.md\`.
          2. Transcription uses CPU faster-whisper by default. Optional managed CUDA 12, Speakrs speaker identification, and CUDA-only Qwen summaries are explicit setup on supported NVIDIA x86_64 hosts.

          ### Notes

          - The app records microphone and desktop audio locally, then transcribes on-device.
          - Whisper models download on first use unless they are already cached locally.
          - GPU acceleration is used automatically when supported (CUDA on Windows, Metal on Apple Silicon). Linux Core Beta transcription stays on CPU faster-whisper.

          ### Privacy

          - Zero telemetry
          - No cloud transcription
          - No account required

          ### Help

          - Documentation: https://github.com/${REPO}/blob/master/README.md
          - Security audit: https://github.com/${REPO}/blob/master/docs/completed/audits/SECURITY_AUDIT.md
          - Third-party notices: https://github.com/${REPO}/blob/master/THIRD_PARTY_NOTICES.md
          EOF
          fi

          cat docs/development/RELEASE_FFMPEG_NOTICE.md >> release-notes.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: AvaNevis ${{ github.ref_name }}
          files: |
            release-upload/*
            release-legal/legal/ffmpeg-8.1.2.tar.xz
            release-legal/legal/THIRD_PARTY_NOTICES.md
            release-legal/avanevis-legal-${{ steps.collect_assets.outputs.version }}.zip
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
