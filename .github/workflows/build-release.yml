name: Build & Release Installer

# Updated to re-register workflow triggers with GitHub
on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Required to create releases

jobs:
  verify-speakrs-release-artifacts:
    name: Verify Speakrs release artifact checksums
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Speakrs pack verification downloads
        uses: actions/cache@v4
        with:
          path: .cache/speakrs-pack-verify
          key: speakrs-pack-verify-${{ hashFiles('src/ai-addon/speakrs-pack-spec.js') }}

      - name: Download and verify Speakrs model-pack and ORT checksums
        run: node scripts/verify-speakrs-packaging.js --verify-pack-checksums

  build-installer:
    name: Build ${{ matrix.os }} Installer
    runs-on: ${{ matrix.runner }}
    needs: verify-speakrs-release-artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            build-script: npm run build
            artifact-path: "dist/AvaNevis-Setup-*.exe"
            artifact-name: avanevis-installer-windows
          - os: macOS
            runner: macos-14 # macOS 14 (Sonoma) with M1/M2/M3 runners
            rust-target: aarch64-apple-darwin
            build-script: npm run build:mac
            artifact-path: "dist/AvaNevis-Setup-*.dmg"
            artifact-name: avanevis-installer-macos
          - os: Linux
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            build-script: npm run build:linux
            artifact-path: |
              dist/AvaNevis-Setup-*.AppImage
              dist/AvaNevis-Setup-*.pkg.tar.zst
              dist/AvaNevis-Setup-*.deb
            artifact-name: avanevis-installer-linux

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain master as of 2026-08-05 (PR #182)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.rust-target }}
          components: rustfmt, clippy

      - name: Cache cargo
        # Swatinem/rust-cache v2.9.2
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: native/speakrs-cli
          cache-on-failure: true

      - name: Verify Swift version (macOS)
        if: matrix.os == 'macOS'
        run: |
          swift --version
          echo "Swift toolchain ready for AudioCaptureHelper build"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Linux package inspection tools
        if: matrix.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file zstd libarchive-tools libpulse0 fakeroot dpkg

      - name: Create placeholder icon (if missing - Windows only)
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          # Ensure build directory exists
          if (-not (Test-Path "build")) {
            New-Item -ItemType Directory -Path "build" | Out-Null
          }

          if (-not (Test-Path "build/icon.ico")) {
            Write-Host "Creating placeholder icon..."
            # Download a placeholder microphone icon
            $url = "https://raw.githubusercontent.com/icons8/flat-color-icons/master/png/256/microphone.png"
            $png = "build/temp.png"

            try {
              Invoke-WebRequest -Uri $url -OutFile $png -ErrorAction Stop

              # Convert PNG to ICO using PowerShell
              Add-Type -AssemblyName System.Drawing
              $img = [System.Drawing.Image]::FromFile((Resolve-Path $png))
              $icon = [System.Drawing.Icon]::FromHandle($img.GetHicon())
              $stream = [System.IO.File]::Create("build/icon.ico")
              $icon.Save($stream)
              $stream.Close()
              $img.Dispose()

              Remove-Item $png
              Write-Host "Placeholder icon created!"
            } catch {
              Write-Host "Could not create icon, using fallback..."
              # Create a minimal 1x1 ICO as absolute fallback
              $bytes = @(0,0,1,0,1,0,16,16,0,0,1,0,32,0,104,4,0,0,22,0,0,0)
              [System.IO.File]::WriteAllBytes("build/icon.ico", $bytes)
            }
          }

      # Note: npm run build/build:mac includes prepare-build which:
      # 1. Cleans dist/ folder (prevents stale files from previous builds)
      # 2. Downloads Python runtime, ffmpeg, and prepares dependencies
      - name: Build installer (Windows)
        if: matrix.os == 'Windows'
        run: ${{ matrix.build-script }}
        timeout-minutes: 75

      - name: Build installer (macOS)
        if: matrix.os == 'macOS'
        # Optional Apple Developer signing (omit until enrolled — builds ad-hoc sign today):
        # CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
        run: |
          echo "Open file limit before: $(ulimit -n)"
          ulimit -n 10240 || true
          echo "Open file limit after: $(ulimit -n)"
          ${{ matrix.build-script }}
        timeout-minutes: 75

      - name: Build installers (Linux)
        if: matrix.os == 'Linux'
        run: ${{ matrix.build-script }}
        timeout-minutes: 75

      - name: Verify packaged Speakrs CLI and fixture
        if: matrix.os != 'Linux'
        run: node scripts/verify-speakrs-packaging.js --packaged

      - name: Verify packaged macOS app smoke checks
        if: matrix.os == 'macOS'
        run: bash scripts/verify-macos-packaged-app.sh

      - name: Verify packaged Linux artifacts
        if: matrix.os == 'Linux'
        run: node scripts/verify-linux-packaging.js --unpacked --appimage --pacman --deb

      - name: Verify package version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF#refs/tags/v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "package.json version ($package_version) does not match tag ($tag_version)"
            exit 1
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 30
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-installer
      - verify-speakrs-release-artifacts
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      # Checkout must run before download-artifact: checkout clears the workspace and
      # would delete release-artifacts/ if download ran first (see f411436 regression).
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve release version
        id: release_version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Stage release legal assets
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          RELEASE_LEGAL_DIR: ${{ github.workspace }}/release-legal
        run: node scripts/stage-release-legal-assets.js

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Collect release assets
        id: collect_assets
        shell: bash
        run: |
          set -euo pipefail

          windows_asset=$(find release-artifacts/avanevis-installer-windows -type f -name '*.exe' | head -n 1)
          macos_asset=$(find release-artifacts/avanevis-installer-macos -type f -name '*.dmg' | head -n 1)
          linux_appimage=$(find release-artifacts/avanevis-installer-linux -type f -name 'AvaNevis-Setup-*.AppImage' | head -n 1)
          linux_pacman=$(find release-artifacts/avanevis-installer-linux -type f -name 'AvaNevis-Setup-*.pkg.tar.zst' | head -n 1)
          linux_deb=$(find release-artifacts/avanevis-installer-linux -type f -name 'AvaNevis-Setup-*.deb' | head -n 1)

          if [ -z "$windows_asset" ] || [ -z "$macos_asset" ] || [ -z "$linux_appimage" ] || [ -z "$linux_pacman" ] || [ -z "$linux_deb" ]; then
            echo "Expected release assets were not downloaded"
            find release-artifacts -maxdepth 3 -type f | sort || true
            exit 1
          fi

          mkdir -p release-upload
          cp "$windows_asset" release-upload/
          cp "$macos_asset" release-upload/
          cp "$linux_appimage" release-upload/
          cp "$linux_pacman" release-upload/
          cp "$linux_deb" release-upload/

          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "windows_name=$(basename "$windows_asset")" >> $GITHUB_OUTPUT
          echo "windows_size=$(du -h "$windows_asset" | cut -f1)" >> $GITHUB_OUTPUT
          echo "macos_name=$(basename "$macos_asset")" >> $GITHUB_OUTPUT
          echo "macos_size=$(du -h "$macos_asset" | cut -f1)" >> $GITHUB_OUTPUT
          echo "linux_appimage_name=$(basename "$linux_appimage")" >> $GITHUB_OUTPUT
          echo "linux_appimage_size=$(du -h "$linux_appimage" | cut -f1)" >> $GITHUB_OUTPUT
          echo "linux_pacman_name=$(basename "$linux_pacman")" >> $GITHUB_OUTPUT
          echo "linux_pacman_size=$(du -h "$linux_pacman" | cut -f1)" >> $GITHUB_OUTPUT
          echo "linux_deb_name=$(basename "$linux_deb")" >> $GITHUB_OUTPUT
          echo "linux_deb_size=$(du -h "$linux_deb" | cut -f1)" >> $GITHUB_OUTPUT

      - name: Build release notes
        shell: bash
        run: |
          VERSION="${{ steps.collect_assets.outputs.version }}"
          NOTES_FILE="docs/releases/v${VERSION}.md"
          WINDOWS_NAME="${{ steps.collect_assets.outputs.windows_name }}"
          WINDOWS_SIZE="${{ steps.collect_assets.outputs.windows_size }}"
          MACOS_NAME="${{ steps.collect_assets.outputs.macos_name }}"
          MACOS_SIZE="${{ steps.collect_assets.outputs.macos_size }}"
          LINUX_APPIMAGE_NAME="${{ steps.collect_assets.outputs.linux_appimage_name }}"
          LINUX_APPIMAGE_SIZE="${{ steps.collect_assets.outputs.linux_appimage_size }}"
          LINUX_PACMAN_NAME="${{ steps.collect_assets.outputs.linux_pacman_name }}"
          LINUX_PACMAN_SIZE="${{ steps.collect_assets.outputs.linux_pacman_size }}"
          LINUX_DEB_NAME="${{ steps.collect_assets.outputs.linux_deb_name }}"
          LINUX_DEB_SIZE="${{ steps.collect_assets.outputs.linux_deb_size }}"
          REPO="${{ github.repository }}"

          # Escaped backticks so installer filenames are not executed by the shell.
          cat <<EOF > release-notes.md
          ## AvaNevis v${VERSION}

          ### Downloads

          - Windows installer: \`${WINDOWS_NAME}\` (${WINDOWS_SIZE})
          - macOS installer: \`${MACOS_NAME}\` (${MACOS_SIZE})
          - Linux AppImage: \`${LINUX_APPIMAGE_NAME}\` (${LINUX_APPIMAGE_SIZE})
          - Linux pacman package: \`${LINUX_PACMAN_NAME}\` (${LINUX_PACMAN_SIZE})
          - Linux deb package (experimental): \`${LINUX_DEB_NAME}\` (${LINUX_DEB_SIZE})

          EOF

          if [ -f "$NOTES_FILE" ]; then
            # Prefer the curated release doc (skip its H1); keep Downloads above.
            tail -n +2 "$NOTES_FILE" >> release-notes.md
            printf '\n' >> release-notes.md
          else
            cat <<EOF >> release-notes.md
          ### What's New

          - See \`docs/releases/v${VERSION}.md\` (add this file before tagging) or the [README](https://github.com/${REPO}/blob/master/README.md) Highlights for this release.

          ### Platform Support

          - Windows 10/11 x64
          - macOS 13+ on Apple Silicon
          - Linux x86_64 Core Beta (Omarchy first; other distros are experimental betas)

          ### Installation

          **Windows**
          1. Download the \`.exe\` installer.
          2. Run it. If SmartScreen appears, choose "More info" then "Run anyway".
          3. Launch AvaNevis from the Start Menu.

          **macOS**
          1. Download the \`.dmg\` file.
          2. Drag AvaNevis into Applications.
          3. On first launch, right-click the app and choose "Open" to bypass Gatekeeper for the unsigned build.
          4. Grant microphone and screen recording permissions when prompted.

          **Linux Core Beta**
          1. On Omarchy/Arch install the pacman package, or run the AppImage. Debian-family friends can try the experimental \`.deb\`. See \`docs/guides/LINUX_EXPERIMENTAL.md\`.
          2. Transcription uses CPU faster-whisper; speaker identification and summaries remain unavailable in this version.

          ### Notes

          - The app records microphone and desktop audio locally, then transcribes on-device.
          - Whisper models download on first use unless they are already cached locally.
          - GPU acceleration is used automatically when supported (CUDA on Windows, Metal on Apple Silicon). Linux Core Beta transcription stays on CPU faster-whisper.

          ### Privacy

          - Zero telemetry
          - No cloud transcription
          - No account required

          ### Help

          - Documentation: https://github.com/${REPO}/blob/master/README.md
          - Security audit: https://github.com/${REPO}/blob/master/docs/completed/audits/SECURITY_AUDIT.md
          - Third-party notices: https://github.com/${REPO}/blob/master/THIRD_PARTY_NOTICES.md
          EOF
          fi

          cat docs/development/RELEASE_FFMPEG_NOTICE.md >> release-notes.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: AvaNevis ${{ github.ref_name }}
          files: |
            release-upload/*
            release-legal/legal/ffmpeg-8.0.1.tar.xz
            release-legal/legal/THIRD_PARTY_NOTICES.md
            release-legal/avanevis-legal-${{ steps.collect_assets.outputs.version }}.zip
          body_path: release-notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
