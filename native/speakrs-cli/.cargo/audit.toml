# cargo-audit exceptions for the speakrs-cli dependency tree.
#
# zip 6.0.0 (via ndarray-npy 0.10.0, pinned by speakrs =0.5.0, which
# requires zip "6"): RUSTSEC-2026-0367, RUSTSEC-2026-0368 and
# RUSTSEC-2026-0369 all concern filesystem extraction —
# ZipArchive::extract() / ZipStreamReader::extract() following symlinks
# or preserving SUID/SGID bits. ndarray-npy only opens ZipArchive and
# reads entries in memory via by_name(); neither it nor speakrs-cli
# calls any extract API, and the archives read are local model files,
# not attacker-controlled downloads. zip cannot move to >= 9 without a
# speakrs release that raises its ndarray-npy/zip requirements.
# Revisit on the next speakrs update; review by 2027-01-31 (aligned
# with the sprintf-js exception in the October maintenance record).
#
# RUSTSEC-2026-0381: webpki-roots 0.26.11 is a certificate-free compatibility
# shim: its entire API is `pub use parent::TLS_SERVER_ROOTS`. Cargo.lock resolves
# parent to patched webpki-roots 1.0.10. ureq 2.12.1 (through ocipkg/intel-mkl-src,
# build dependencies of speakrs) still requires the 0.26 facade. The advisory's
# version-only range flags this facade although its actual roots are patched.
# tests/js/certificate-trust-dependencies.test.js guards the resolved parent,
# every roots bundle and the validator version so this exception cannot hide
# a rollback to vulnerable trust data. Reviewed 2026-10-20; revisit with upstream
# ureq/ocipkg updates or by 2026-11-20. No affected roots are retained by this shim.

[advisories]
ignore = [
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0381",
]
