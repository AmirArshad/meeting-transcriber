[package]
name = "speakrs-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "AvaNevis speakrs CLI: local-only diarization, frozen JSON stdout contract"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
speakrs = { version = "=0.5.0", default-features = false, features = ["default-linalg", "coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
speakrs = { version = "=0.5.0", default-features = false, features = ["default-linalg", "cuda", "load-dynamic"] }

[target.'cfg(target_os = "linux")'.dependencies]
speakrs = { version = "=0.5.0", default-features = false, features = ["default-linalg", "cuda", "load-dynamic"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows", target_os = "linux")))'.dependencies]
speakrs = { version = "=0.5.0", default-features = false, features = ["default-linalg"] }

[dev-dependencies]
ndarray = "0.17"
ndarray-npy = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Temporary upstream compatibility patch: ndarray-npy 0.10 pins vulnerable zip 6.
# Remove once ndarray-npy supports a RustSec-2026-0429 fixed zip release.
[patch.crates-io]
ndarray-npy = { path = "vendor/ndarray-npy" }
