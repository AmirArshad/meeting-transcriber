[package]
name = "speakrs-cli"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Thin AvaNevis CLI wrapper around speakrs (Task 0 spike / Task 1 contract)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speakrs = { version = "=0.5.0", default-features = false, features = ["default-linalg", "coreml"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
