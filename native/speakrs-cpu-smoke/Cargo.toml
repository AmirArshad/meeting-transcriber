[package]
name = "speakrs-cpu-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0"

[[bin]]
name = "speakrs-cpu-smoke"
path = "../speakrs-cli/src/main.rs"

[features]
ci-cpu-smoke = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speakrs = { version = "=0.7.0", default-features = false, features = ["cpu"] }

[patch.crates-io]
ndarray-npy = { path = "../speakrs-cli/vendor/ndarray-npy" }
